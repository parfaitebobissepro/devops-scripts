- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg2
      - software-properties-common
      - apt-transport-https
      - python3-pip
      - docker.io
    update_cache: yes

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/debian/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/debian bullseye stable
    state: present

- name: Install Docker Engine (latest version)
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: latest

- name: Install required Python libraries
  pip:
    name:
      - "requests==2.31.0"
      - "docker==6.1.3"
      - "docker-compose"
    state: present

- name: Add user to docker group
  user:
    name: "docker"
    groups: docker

- name: Create user integ with password
  user:
    name: "integ"
    password: "{{ 'integ' | password_hash('sha512') }}"
    groups: docker,vagrant
    append: yes

- name: Start Docker service
  service:
    name: docker
    state: started

- name: Create multiple folders with docker user rights
  file:
    path: "{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: '0777'
  loop:
    - /jenkins_data
    - /opt/sonatype/nexus3
    - /opt/sonarqube

