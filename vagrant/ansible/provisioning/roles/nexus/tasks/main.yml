- name: Install Docker SDK for Python
  pip:
    name: docker

- name: Ensure Docker service is started
  service:
    name: docker
    state: started
    enabled: yes
    
- name: Exécuter Nexus dans Docker
  docker_container:
    name: "{{ nexus_container_name }}"
    image: "{{ nexus_image }}"
    state: started
    restart_policy: always
    published_ports:
      - "{{ nexus_port }}:8081"
    volumes:
      - "{{ nexus_home }}:/opt/sonatype/nexus3"
    env:
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=512m"  # Adjusted Java heap settings
    memory: "2g"
    
- name: Wait for Nexus to be ready
  uri:
    url: "http://localhost:{{ nexus_port }}/service/rest/v1/status"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 10

- name: Create 'integ' user via REST API
  uri:
    url: "http://localhost:{{ nexus_port }}/service/rest/v1/security/users"
    method: POST
    headers:
      Content-Type: "application/json"
      Authorization: "Basic {{ 'admin:admin123' | b64encode }}"
    body_format: json
    body:
      userId: "integ"
      firstName: "Integration"
      lastName: "User"
      emailAddress: "integ@local"
      password: "integ"
      status: "active"
      roles: ["nx-admin"]
    status_code: 200
